name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: alrayan-main.html
            id: com.alrayyan.khalifa
            name: ALRAYYAN KHALIFA
            tag: main
          - file: alrayan-sales.html
            id: com.alrayyan.khalifa.sales
            name: ALRAYYAN SALES
            tag: sales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Capacitor project
        run: |
          mkdir -p build/www
          cp "${{ matrix.file }}" build/www/index.html
          cd build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          echo '{"appId":"${{ matrix.id }}","appName":"${{ matrix.name }}","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Apply app icon
        run: |
          sudo apt-get install -y imagemagick
          R=build/android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            convert icon-full.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            convert icon-full.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher_round.png
            convert icon-foreground.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#050707</color></resources>' > $R/values/ic_launcher_background.xml
      - name: Build APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.tag }}
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
