name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Webview APK
      run: |
        mkdir -p android-project/app/src/main/assets
        mkdir -p android-project/app/src/main/res/drawable
        mkdir -p android-project/app/src/main/java/com/alrayan/motostock
        
        cp index.html android-project/app/src/main/assets/
        cp IMG-20260905-WA0013.jpg android-project/app/src/main/assets/ 2>/dev/null || true
        cp Logo.png android-project/app/src/main/assets/ 2>/dev/null || true

        cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.alrayan.motostock">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="الريان قطع غيار" android:allowBackup="true" android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android-project/app/src/main/java/com/alrayan/motostock/MainActivity.java
        package com.alrayan.motostock;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);

                WebSettings ws = webView.getSettings();
                ws.setJavaScriptEnabled(true);
                ws.setDomStorageEnabled(true);
                ws.setAllowFileAccess(true);
                ws.setAllowContentAccess(true);

                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
            }
        }
        EOF

    - name: Build APK with Gradle
      run: |
        cd android-project
        gradle build || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlRayan-Moto-Store-APK
        path: "**/*.apk"
