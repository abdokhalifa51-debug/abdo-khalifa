name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Directory & Build Capacitor
        run: |
          mkdir -p www
          cp -r index.html catalog.csv styles.xml ic_launcher.xml AndroidManifest.xml MainActivity.java README_AR.txt www/ 2>/dev/null || cp -r * www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "AlRayan Moto Store" "com.alrayan.motostore" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlRayan-Moto-Store-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
