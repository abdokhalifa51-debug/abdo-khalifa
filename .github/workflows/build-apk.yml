name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Cordova
      run: |
        npm install -g cordova

    - name: Create & Build Project
      run: |
        cordova create app com.alrayan.motostock "الريان قطع غيار"
        cd app
        cordova platform add android
        
        # نسخ ملفات الكود والصورة مباشرة إلى مجلد الـ www الخاص بـ Cordova
        rm -rf www/*
        cp ../index.html www/
        cp ../IMG-20260905-WA0013.jpg www/ 2>/dev/null || true
        cp ../Logo.png www/ 2>/dev/null || true
        
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlRayan-Moto-Store-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
