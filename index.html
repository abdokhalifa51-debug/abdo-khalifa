<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة قطع غيار الموتوسيكلات</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
    body { background: #f0f2f5; color: #1c2b36; padding-bottom: 60px; }
    
    header { background: #0077b6; color: #fff; padding: 15px; text-align: center; }
    .logo-img { width: 100px; max-width: 80%; height: auto; margin-bottom: 8px; border-radius: 8px; }
    header h1 { font-size: 20px; margin-bottom: 4px; }
    header p { font-size: 12px; opacity: 0.9; }

    nav { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px; justify-content: center; }
    nav button { border: 0; border-radius: 8px; padding: 10px 14px; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; }
    nav button.secondary { background: #6c757d; }

    .card { background: #fff; border-radius: 12px; padding: 14px; margin: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .kpi { background: #f8fafc; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #e2e8f0; }
    .kpi b { font-size: 18px; color: #0284c7; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th { background: #f1f5f9; padding: 10px 6px; border-bottom: 2px solid #e2e8f0; text-align: center; white-space: nowrap; }
    td { padding: 8px 4px; border-bottom: 1px solid #f1f5f9; text-align: center; }
    td input[type="number"] { width: 65px; padding: 4px; text-align: center; border-radius: 4px; border: 1px solid #cbd5e1; }

    .hide { display: none !important; }
    .btn-add { background: #10b981; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; float: left; }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="شعار الريان" class="logo-img" onerror="this.style.display='none'">
    <h1>الريان لقطع غيار الموتوسيكلات</h1>
    <p>إدارة الكتالوج والمخزون والأسعار</p>
  </header>

  <nav>
    <button onclick="show('home')">الرئيسية</button>
    <button onclick="show('products')">الكتالوج</button>
    <button onclick="show('stock')">المخزون</button>
    <button onclick="show('sale')">بيع / منصرف</button>
    <button onclick="show('buy')">شراء / وارد</button>
    <button onclick="show('customers')" class="secondary">العملاء</button>
  </nav>

  <main>
    <section id="home">
      <div class="card">
        <div class="kpis">
          <div class="kpi">عدد الأصناف<br><b id="nprod">0</b></div>
          <div class="kpi">إجمالي الوحدة<br><b id="nloc">0</b></div>
          <div class="kpi">إجمالي المخزون<br><b id="totalQty">0</b></div>
          <div class="kpi">القيمة التقديرية<br><b id="totalVal">0 ج</b></div>
        </div>
      </div>
    </section>

    <section id="products" class="hide">
      <div class="card">
        <button class="btn-add" onclick="addProduct()">+ إضافة صنف</button>
        <div style="clear:both;"></div>
        <div class="grid">
          <input type="text" id="search" placeholder="بحث بالاسم أو الكود..." oninput="render()">
          <select id="brandFilter" onchange="render()"><option value="">كل الماركات</option></select>
          <select id="modelFilter" onchange="render()"><option value="">كل الموديلات</option></select>
          <select id="catFilter" onchange="render()"><option value="">كل الأقسام</option></select>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>الماركة</th>
                <th>الموديل</th>
                <th>الصنف</th>
                <th>شراء</th>
                <th>قطاعي</th>
                <th>جملة</th>
                <th>موزع</th>
              </tr>
            </thead>
            <tbody id="stockRows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="stock" class="hide"><div class="card"><h3>المخزون التفصيلي</h3></div></section>
    <section id="sale" class="hide"><div class="card"><h3>حركة البيع</h3></div></section>
    <section id="buy" class="hide"><div class="card"><h3>حركة الشراء</h3></div></section>
    <section id="customers" class="hide"><div class="card"><h3>قائمة العملاء</h3></div></section>
  </main>

  <script>
    const SEED = {
      products: [
        { id: "p1", code: "AR1001", category: "محرّك", brand: "هوجن", model: "HJ150-4", name: "بستم", buy: 0, retail: 0, wholesale: 0, dealer: 0 },
        { id: "p2", code: "AR1002", category: "محرّك", brand: "هوجن", model: "HJ150-4", name: "طقم بستم", buy: 0, retail: 0, wholesale: 0, dealer: 0 },
        { id: "p3", code: "AR1003", category: "محرّك", brand: "هوجن", model: "HJ150-4", name: "شنبر بستم", buy: 0, retail: 0, wholesale: 0, dealer: 0 },
        { id: "p4", code: "AR1004", category: "محرّك", brand: "هوجن", model: "HJ150-4", name: "بنز بستم", buy: 0, retail: 0, wholesale: 0, dealer: 0 },
        { id: "p5", code: "AR1005", category: "محرّك", brand: "هوجن", model: "HJ150-4", name: "جوان وش سلندر", buy: 0, retail: 0, wholesale: 0, dealer: 0 }
      ],
      locations: [],
      moves: []
    };

    let db = JSON.parse(localStorage.getItem('alrayanMotoStock_v2')) || SEED;

    function save() {
      localStorage.setItem('alrayanMotoStock_v2', JSON.stringify(db));
    }

    function show(id) {
      document.querySelectorAll('main section').forEach(x => x.classList.add('hide'));
      document.getElementById(id).classList.remove('hide');
      render();
    }

    function render() {
      let q = (document.getElementById('search')?.value || '').toLowerCase();
      let cf = (document.getElementById('catFilter')?.value || '');
      let bf = (document.getElementById('brandFilter')?.value || '');
      let mf = (document.getElementById('modelFilter')?.value || '');

      if(document.getElementById('nprod')) document.getElementById('nprod').textContent = db.products.length;

      let filtered = db.products.filter(p => {
        let matchQ = !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q);
        let matchC = !cf || p.category === cf;
        let matchB = !bf || p.brand === bf;
        let matchM = !mf || p.model === mf;
        return matchQ && matchC && matchB && matchM;
      });

      let html = '';
      filtered.forEach(p => {
        html += `<tr>
          <td>${p.brand || ''}</td>
          <td>${p.model || ''}</td>
          <td>${p.name || ''}</td>
          <td><input type="number" value="${p.buy || 0}" onchange="updatePrice('${p.id}', 'buy', this.value)"> ج</td>
          <td><input type="number" value="${p.retail || 0}" onchange="updatePrice('${p.id}', 'retail', this.value)"> ج</td>
          <td><input type="number" value="${p.wholesale || 0}" onchange="updatePrice('${p.id}', 'wholesale', this.value)"> ج</td>
          <td><input type="number" value="${p.dealer || 0}" onchange="updatePrice('${p.id}', 'dealer', this.value)"> ج</td>
        </tr>`;
      });

      let stockRows = document.getElementById('stockRows');
      if(stockRows) stockRows.innerHTML = html;
    }

    function updatePrice(productId, priceType, newValue) {
      let prod = db.products.find(p => p.id === productId);
      if(prod) {
        prod[priceType] = parseFloat(newValue) || 0;
        save();
      }
    }

    function addProduct() {
      let name = prompt("اسم الصنف الجديد:");
      if(!name) return;
      let brand = prompt("الماركة:") || "";
      let model = prompt("الموديل:") || "";
      
      let newProd = {
        id: "p" + (Date.now()),
        code: "AR" + (db.products.length + 1000),
        category: "عام",
        brand: brand,
        model: model,
        name: name,
        buy: 0, retail: 0, wholesale: 0, dealer: 0
      };
      
      db.products.push(newProd);
      save();
      render();
    }

    render();
  </script>
</body>
</html>
